[package]
name = "taceo-proof-wasm"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
authors = ["TACEO GmbH <hello@taceo.io>"]
homepage = "https://www.taceo.io"
repository = "https://github.com/TaceoLabs/proof-client"
license = "MIT OR Apache-2.0"
publish = false
readme = "./README.md"


[lib]
crate-type = ["cdylib"]

[dependencies]
ark-bn254 = { version = "0.5.0", default-features = false }
ark-bls12-381 = { version = "0.5.0", default-features = false }
ark-bls12-377 = { version = "0.5.0", default-features = false }
ark-ec = "0.5.0"
ed25519-dalek = { version = "2.1.1", features = ["digest"] }
sha2 = "0.10.8"
uuid = { version = "1.16.0", features = ["v4", "js"] }
wasm-bindgen = "0.2.100"
serde-wasm-bindgen = "0.6.5"
bincode = { version = "1.3.3", default-features = false }
crypto_box = { version = "0.9.1", features = ["seal"] }
co-circom-types = { git = "https://github.com/TaceoLabs/co-snarks", rev = "5d8f254" }
circom-types = { git = "https://github.com/TaceoLabs/co-snarks", rev = "5d8f254", features = ["ark-bls12-377", "ark-bls12-381"] }
base64ct = { version = "1.7.3", features = ["alloc"] }
rand = "0.8.5"
getrandom = { version = "0.2.15", default-features = false, features = ["js"] }
co-noir-types = { git = "https://github.com/TaceoLabs/co-snarks", rev = "5d8f254" }
noir-types = { git = "https://github.com/TaceoLabs/co-snarks", rev = "5d8f254" }

[profile.release]
opt-level = "z"
strip = true
lto = true
codegen-units = 1
panic = "abort"

[package.metadata.wasm-pack.profile.release]
# https://github.com/rustwasm/wasm-pack/issues/1501
wasm-opt = ["-Oz", "--enable-bulk-memory", "--enable-nontrapping-float-to-int"]

